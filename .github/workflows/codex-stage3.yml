name: Codex Stage 3 Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install dependencies
        env:
          CLAUDE_CODE_SKIP_CHROME_MCP_SETUP: "1"
        run: bun install --frozen-lockfile

      - name: Check stage formatting
        run: |
          bunx biome ci \
            src/services/api/codex/client.ts \
            src/services/api/codex/index.ts \
            src/services/api/codex/requestMetadata.ts \
            src/services/api/codex/__tests__/client.identity.test.ts \
            src/services/api/codex/__tests__/client.turnState.test.ts \
            src/services/api/codex/__tests__/request.runner.ts \
            src/services/api/codex/__tests__/requestMetadata.test.ts

      - name: Type check diagnostic ratchet
        run: |
          set +e
          output="$(bun run typecheck 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          errors="$(printf '%s\n' "$output" | grep 'error TS' || true)"
          unexpected="$(printf '%s\n' "$errors" | grep -Ev '^(src/cli/bg/jobStore\.ts\(65,9\): error TS2352|src/entrypoints/cli\.tsx\(435,42\): error TS5097)' || true)"
          error_count="$(printf '%s\n' "$errors" | grep -c 'error TS' || true)"
          if [ -n "$unexpected" ] || [ "$error_count" -ne 2 ]; then
            echo 'Unexpected TypeScript diagnostics:'
            printf '%s\n' "$unexpected"
            exit 1
          fi
          echo 'Only the two pre-existing main-branch TypeScript diagnostics remain.'

      - name: Dependency boundary ratchet
        run: bun run check:boundaries

      - name: Run Codex request lifecycle tests
        run: |
          bun test \
            src/services/api/codex/__tests__/client.identity.test.ts \
            src/services/api/codex/__tests__/client.turnState.test.ts \
            src/services/api/codex/__tests__/requestMetadata.test.ts \
            src/services/api/codex/__tests__/request.test.ts

      - name: Build
        run: bun run build:vite
