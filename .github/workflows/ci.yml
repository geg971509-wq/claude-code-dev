name: CI

on:
  push:
    branches: [main, "feature/*", "feat/*"]
  pull_request:
    branches: [main, "feat/*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, 2026-04-25
        env:
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
          GIT_CONFIG_KEY_1: advice.defaultBranchName
          GIT_CONFIG_VALUE_1: "false"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6, 2026-04-25
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, 2026-04-25
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        env:
          CLAUDE_CODE_SKIP_CHROME_MCP_SETUP: "1"
        run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bunx biome ci .

      - name: Type check
        run: bun run typecheck

      - name: Dependency boundary ratchet
        run: bun run check:boundaries

      - name: Test with Coverage
        run: |
          bun test --coverage --coverage-reporter lcov --coverage-dir coverage
          test -s coverage/lcov.info
          grep -q '^SF:' coverage/lcov.info

      - name: Build
        run: bun run build:vite

      - name: Bundle integrity
        run: bun run check:bundle

      - name: Production runtime smoke
        run: bun run scripts/production-test.ts --offline

      - name: npm package smoke
        env:
          CLAUDE_CODE_SKIP_CHROME_MCP_SETUP: "1"
        run: |
          TARBALL="$(npm pack --silent --ignore-scripts)"
          INSTALL_DIR="$(mktemp -d)"
          trap 'rm -rf "$INSTALL_DIR" "$TARBALL"' EXIT
          npm install --prefix "$INSTALL_DIR" --no-audit --no-fund "./$TARBALL"
          "$INSTALL_DIR/node_modules/.bin/ccb" --version
          "$INSTALL_DIR/node_modules/.bin/ccb" --help >/dev/null
          "$INSTALL_DIR/node_modules/.bin/ccb-bun" --version
